name: PHP release pipeline
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: release-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  release:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release/') && (github.event.action != 'closed' || github.event.pull_request.merged == true)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    env:
      SOURCE_SHA: ${{ github.event.pull_request.merged == true && github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha }}
    steps:
      # Public source checkout uses Git directly, without actions implemented in Node.
      - name: Check out exact source
        run: |
          git init .
          git fetch --depth=1 https://github.com/millaredos/f1-25-setup-engineer.git "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install PHP tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-mysql php-zip php-curl
      - name: Verify application
        run: |
          php dev/bin/translations.php --check
          php dev/tests/run.php
          php dev/tests/http.php
      - name: Publish Alpha or prepare stable draft
        if: github.event.action == 'closed' || !contains(github.event.pull_request.body, '<!-- stable-release-only -->')
        env:
          GH_TOKEN: ${{ github.token }}
        run: php dev/bin/publish.php
